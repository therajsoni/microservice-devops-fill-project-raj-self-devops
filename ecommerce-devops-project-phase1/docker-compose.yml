services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api-gateway

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      PRODUCT_SERVICE_URL: http://product-service:4001
      ORDER_SERVICE_URL: http://order-service:4002
    depends_on:
      - product-service
      - order-service

  product-service:
    build: ./services/product-service
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      MONGO_URI: mongodb://mongo:27017/products
    depends_on:
      - mongo

  order-service:
    build: ./services/order-service
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://app:app@postgres:5432/orders
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8-alpine

volumes:
  postgres_data:
  mongo_data:
